<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AEGIS Bio-Node — Gyroid Perfusion Bioreactor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #label {
    position: fixed; bottom: 28px; left: 0; right: 0;
    text-align: center; color: #555; font-size: 11px;
    letter-spacing: 5px; text-transform: uppercase;
    pointer-events: none; user-select: none; z-index: 2;
  }
  #label span { color: #bbb; font-weight: bold; }
  #hint {
    position: fixed; bottom: 10px; left: 0; right: 0;
    text-align: center; color: #333; font-size: 9px;
    letter-spacing: 3px; text-transform: uppercase;
    pointer-events: none; user-select: none; z-index: 2;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; background: #000; z-index: 10;
    color: #444; font-size: 12px; letter-spacing: 4px;
    text-transform: uppercase; transition: opacity 1s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
</style>
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
<div id="loading">Initializing AEGIS Bio-Node</div>
<div id="label"><span>AEGIS Bio-Node</span> &nbsp;&middot;&nbsp; Intelligent Gyroid Perfusion Bioreactor</div>
<div id="hint">Drag to rotate &middot; Auto-orbit active</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------ */
/*  Renderer                                                           */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.Camera();

/* ------------------------------------------------------------------ */
/*  Full-screen raymarching shader                                     */
/* ------------------------------------------------------------------ */
const vertexShader = /* glsl */`
  void main() { gl_Position = vec4(position, 1.0); }
`;

const fragmentShader = /* glsl */`
  precision highp float;

  uniform vec2  uResolution;
  uniform float uTime;
  uniform vec2  uMouse;
  uniform float uMouseBlend;

  #define PI            3.14159265359
  #define MAX_STEPS     128
  #define MAX_DIST      25.0
  #define SURF_DIST     0.0012

  /* ---------- SDF primitives ---------- */
  float gyroid(vec3 p) {
    return sin(p.x) * cos(p.y)
         + sin(p.y) * cos(p.z)
         + sin(p.z) * cos(p.x);
  }

  float sdCylinder(vec3 p, float r, float h) {
    vec2 d = vec2(length(p.xz) - r, abs(p.y) - h);
    return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));
  }

  float sdTorus(vec3 p, float R, float r) {
    vec2 q = vec2(length(p.xz) - R, p.y);
    return length(q) - r;
  }

  float sdSphere(vec3 p, float r) { return length(p) - r; }

  /* ---------- Scene map with material ID ---------- */
  float map(vec3 p, out float matID) {
    matID = 0.0;

    /* --- Gyroid lattice core (bounded to a sphere) --- */
    vec3 q = p * 2.6;
    float thickness = 0.030 + 0.010 * sin(uTime * 0.7 + p.y * 2.2 + p.x * 1.5);
    float g = abs(gyroid(q)) - thickness;
    float sphere = sdSphere(p, 1.20);
    float core = max(g, sphere);

    /* --- Inner glow sphere (slightly smaller, used for backlight) --- */
    float innerGlow = sdSphere(p, 1.18);

    /* --- Base plate --- */
    float plate = sdCylinder(vec3(p.x, p.y + 1.45, p.z), 1.55, 0.10);

    /* --- Bottom ring collar --- */
    float botRing = sdTorus(vec3(p.x, p.y + 1.30, p.z), 1.20, 0.035);

    /* --- Top ring collar --- */
    float topRing = sdTorus(vec3(p.x, p.y - 1.25, p.z), 1.20, 0.035);

    /* --- Sensor ports (6 around the base) --- */
    float ports = 1e10;
    for (int i = 0; i < 6; i++) {
      float a = float(i) * PI / 3.0 + 0.3;
      vec3  pos = vec3(p.x - cos(a) * 1.42, p.y + 1.25, p.z - sin(a) * 1.42);
      ports = min(ports, sdCylinder(pos, 0.085, 0.16));
    }

    /* --- Combine: find closest surface and tag material --- */
    float result = core;

    if (plate   < result) { result = plate;   matID = 1.0; }
    if (botRing < result) { result = botRing; matID = 1.0; }
    if (topRing < result) { result = topRing; matID = 1.0; }
    if (ports   < result) { result = ports;   matID = 2.0; }

    return result;
  }

  /* ---------- Normal via central differences ---------- */
  vec3 calcNormal(vec3 p) {
    float dummy;
    vec2 e = vec2(0.0009, 0.0);
    return normalize(vec3(
      map(p + e.xyy, dummy) - map(p - e.xyy, dummy),
      map(p + e.yxy, dummy) - map(p - e.yxy, dummy),
      map(p + e.yyx, dummy) - map(p - e.yyx, dummy)
    ));
  }

  /* ---------- Soft shadow ---------- */
  float softShadow(vec3 ro, vec3 rd, float mint, float maxt, float k) {
    float dummy;
    float res = 1.0;
    float t = mint;
    for (int i = 0; i < 32; i++) {
      vec3  p = ro + rd * t;
      float h = map(p, dummy);
      if (h < 0.001) return 0.0;
      res = min(res, k * h / t);
      t += clamp(h, 0.02, 0.25);
      if (t > maxt) break;
    }
    return clamp(res, 0.0, 1.0);
  }

  /* ---------- Ambient occlusion ---------- */
  float calcAO(vec3 p, vec3 n) {
    float dummy;
    float occ = 0.0;
    float sca = 1.0;
    for (int i = 0; i < 5; i++) {
      float h = 0.012 + 0.028 * float(i);
      float d = map(p + n * h, dummy);
      occ += (h - d) * sca;
      sca *= 0.82;
    }
    return clamp(1.0 - 1.6 * occ, 0.0, 1.0);
  }

  /* ---------- Camera ---------- */
  void getCamera(out vec3 ro, out vec3 rd, vec2 uv) {
    float autoAngle = uTime * 0.12;
    float userAngle = uMouse.x * 3.5;
    float angle = mix(autoAngle, userAngle, uMouseBlend);

    float yOff = mix(0.4, uMouse.y * 2.5 + 0.4, uMouseBlend);
    float dist  = 4.2;

    ro = vec3(cos(angle) * dist, yOff, sin(angle) * dist);
    vec3 ta = vec3(0.0, -0.15, 0.0);

    vec3 ww = normalize(ta - ro);
    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
    vec3 vv = cross(uu, ww);
    rd = normalize(uv.x * uu + uv.y * vv + 1.8 * ww);
  }

  /* ---------- Main ---------- */
  void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / min(uResolution.x, uResolution.y);

    vec3 ro, rd;
    getCamera(ro, rd, uv);

    /* --- Raymarch --- */
    float t = 0.05;
    float matID = 0.0;
    bool  hit   = false;

    for (int i = 0; i < MAX_STEPS; i++) {
      vec3 p = ro + rd * t;
      float d = map(p, matID);
      if (d < SURF_DIST) { hit = true; break; }
      if (t > MAX_DIST) break;
      t += d * 0.75;
    }

    float gray = 0.0;

    if (hit) {
      vec3 p = ro + rd * t;
      vec3 n = calcNormal(p);
      vec3 v = -rd;

      /* --- Three-point lighting (all grayscale) --- */
      vec3 L1 = normalize(vec3( 0.6,  0.8,  0.4));   // key
      vec3 L2 = normalize(vec3(-0.5,  0.4, -0.6));   // fill
      vec3 L3 = normalize(vec3( 0.0, -0.4,  0.8));   // back/bounce

      float d1 = max(dot(n, L1), 0.0);
      float d2 = max(dot(n, L2), 0.0);
      float d3 = max(dot(n, L3), 0.0);

      /* specular on key light */
      vec3  h1  = normalize(L1 + v);
      float sp1 = pow(max(dot(n, h1), 0.0), 40.0);

      float ao     = calcAO(p, n);
      float shadow = softShadow(p + n * 0.01, L1, 0.02, 6.0, 10.0);

      float fresnel = pow(1.0 - max(dot(n, v), 0.0), 4.0);

      if (matID < 0.5) {
        /* ---- Gyroid core: bright, luminous, translucent feel ---- */
        gray = 0.10 + d1 * 0.55 * shadow + d2 * 0.22 + d3 * 0.08;
        gray += sp1 * 0.28 * shadow;
        gray += fresnel * 0.35;

        /* subtle internal pulse — "flowing media" */
        float pulse = 0.04 * sin(uTime * 1.4 + p.y * 4.0 + p.x * 3.0 + p.z * 2.5);
        gray += pulse;
        gray += fresnel * pulse * 2.0;

      } else if (matID < 1.5) {
        /* ---- Housing / rings: dark matte polymer ---- */
        gray = 0.04 + d1 * 0.10 * shadow + d2 * 0.05 + d3 * 0.03;
        gray += sp1 * 0.06;
        gray += fresnel * 0.08;

      } else {
        /* ---- Sensor ports: metallic, brighter ---- */
        gray = 0.18 + d1 * 0.38 * shadow + d2 * 0.12 + d3 * 0.05;
        gray += sp1 * 0.45;
        gray += fresnel * 0.15;
      }

      gray *= ao;
    }

    /* --- Atmospheric fog --- */
    float fog = 1.0 / (1.0 + t * t * 0.018);
    gray *= fog;

    /* --- Depth-of-field fake (blur far details) --- */
    float dof = smoothstep(2.5, 6.0, t);
    gray = mix(gray, gray * 0.7, dof * 0.4);

    /* --- Vignette --- */
    float vig = 1.0 - 0.40 * dot(uv, uv);
    gray *= vig;

    /* --- Film grain --- */
    float grain = fract(sin(dot(gl_FragCoord.xy + uTime, vec2(12.9898, 78.233))) * 43758.5453);
    gray += (grain - 0.5) * 0.025;

    /* --- Subtle background gradient --- */
    if (!hit) {
      float bgGrad = 1.0 - length(uv) * 0.6;
      gray = bgGrad * 0.025;
    }

    gray = clamp(gray, 0.0, 1.0);
    gl_FragColor = vec4(vec3(gray), 1.0);
  }
`;

/* ------------------------------------------------------------------ */
/*  Shader material                                                    */
/* ------------------------------------------------------------------ */
const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms: {
    uResolution:  { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uTime:        { value: 0 },
    uMouse:       { value: new THREE.Vector2(0, 0) },
    uMouseBlend:  { value: 0 },
  },
});

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
scene.add(quad);

/* ------------------------------------------------------------------ */
/*  Interaction — drag to orbit, release returns to auto-orbit         */
/* ------------------------------------------------------------------ */
const mouseTarget = new THREE.Vector2(0, 0);
const mouse       = new THREE.Vector2(0, 0);
let   dragging     = false;
let   idleTimer    = 0;

function pointerDown(x, y) {
  dragging = true;
  idleTimer = 0;
  pointerMove(x, y);
}
function pointerMove(x, y) {
  if (dragging) {
    mouseTarget.x = (x / window.innerWidth - 0.5) * 2;
    mouseTarget.y = -(y / window.innerHeight - 0.5) * 2;
  }
}
function pointerUp() {
  dragging = false;
  idleTimer = 0;
}

window.addEventListener('mousedown', (e) => pointerDown(e.clientX, e.clientY));
window.addEventListener('mousemove', (e) => pointerMove(e.clientX, e.clientY));
window.addEventListener('mouseup',   pointerUp);
window.addEventListener('mouseleave',pointerUp);

window.addEventListener('touchstart', (e) => {
  if (e.touches.length) pointerDown(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (e.touches.length) pointerMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchend', pointerUp);

/* ------------------------------------------------------------------ */
/*  Resize                                                             */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
});

/* ------------------------------------------------------------------ */
/*  Animation loop                                                     */
/* ------------------------------------------------------------------ */
const clock = new THREE.Clock();
let firstFrame = true;

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  const dt = clock.getDelta();

  material.uniforms.uTime.value = elapsed;

  /* smooth mouse */
  mouse.x += (mouseTarget.x - mouse.x) * 0.06;
  mouse.y += (mouseTarget.y - mouse.y) * 0.06;
  material.uniforms.uMouse.value.copy(mouse);

  /* blend between auto-orbit and user control */
  if (dragging) {
    idleTimer = 0;
    material.uniforms.uMouseBlend.value +=
      (1.0 - material.uniforms.uMouseBlend.value) * 0.08;
  } else {
    idleTimer += dt;
    if (idleTimer > 2.5) {
      material.uniforms.uMouseBlend.value +=
        (0.0 - material.uniforms.uMouseBlend.value) * 0.02;
      /* gradually return mouse to neutral */
      mouseTarget.x *= 0.98;
      mouseTarget.y *= 0.98;
    }
  }

  renderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    const el = document.getElementById('loading');
    if (el) {
      el.classList.add('hide');
      setTimeout(() => el.remove(), 1200);
    }
  }
}

animate();
</script>
</body>
</html>
